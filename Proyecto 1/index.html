<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Firebase Auth Exercise</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 400px; margin: 60px auto; }
  input { display: block; width: 100%; margin: 8px 0; padding: 8px; box-sizing: border-box; }
  button { padding: 8px 16px; margin: 4px 4px 4px 0; cursor: pointer; }
  #status { margin-top: 16px; padding: 10px; border-radius: 4px; }
  .ok { background: #d4edda; color: #155724; }
  .error { background: #f8d7da; color: #721c24; }
</style>
</head>
<body>

  <h2>Firebase Auth Exercise</h2>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password (min 6 characters)">

  <button id="btnSignUp">Sign Up</button>
  <button id="btnLogIn">Log In</button>
  <button id="btnLogOut">Log Out</button>

  <div id="status">Not logged in.</div>

  <!--
    TEACHING NOTE: this uses the Firebase "compat" SDK loaded from a CDN.
    It's the easiest way to try Firebase in a single HTML file with no
    build tools (no npm, no bundler). In a real production project you'd
    normally use the modular SDK (import { ... } from "firebase/auth")
    with a bundler like Vite, but that's a separate lesson.
  -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script>
    // ---------------------------------------------------------------
    // 1. FIREBASE CONFIG
    // ---------------------------------------------------------------
    // TEACHING NOTE: this object is NOT a secret. It just tells the Firebase
    // SDK which project to talk to. Real security comes from the Firebase
    // rules (server-side), not from hiding this config.
    // Students get this from: Firebase Console > Project Settings > General
    // > "Your apps" > Web app > SDK setup and configuration.
    const firebaseConfig = {
      apiKey: "AIzaSyAG7qXZMxlPY-zPrfiinQYNJq3_TWIfRWg",
      authDomain: "initialtestproject-2f3b4.firebaseapp.com",
      projectId: "initialtestproject-2f3b4",
      storageBucket: "initialtestproject-2f3b4.firebasestorage.app",
      messagingSenderId: "717731776435",
      appId: "1:717731776435:web:8a673cbc6454c0d7392dc6"
    };

    // Initializes the connection to your Firebase project
    firebase.initializeApp(firebaseConfig);

    // TEACHING NOTE: "auth" is our handle for everything related to
    // authentication (sign up, log in, log out, current user, etc.)
    const auth = firebase.auth();

    // ---------------------------------------------------------------
    // 2. DOM REFERENCES
    // ---------------------------------------------------------------
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const statusDiv = document.getElementById("status");

    function showStatus(message, isError = false) {
      statusDiv.textContent = message;
      statusDiv.className = isError ? "error" : "ok";
    }

    // ---------------------------------------------------------------
    // 3. SIGN UP
    // ---------------------------------------------------------------
    // TEACHING NOTE: createUserWithEmailAndPassword() returns a Promise.
    // We use .then() / .catch() here instead of async/await to keep it
    // beginner-friendly and easy to trace step by step on the screen.
    document.getElementById("btnSignUp").addEventListener("click", () => {
      const email = emailInput.value;
      const password = passwordInput.value;

      auth.createUserWithEmailAndPassword(email, password)
        .then((userCredential) => {
          // TEACHING NOTE: userCredential.user contains the newly created
          // account's info, including its unique uid.
          const user = userCredential.user;
          showStatus(`Account created! uid: ${user.uid}`);
        })
        .catch((error) => {
          // TEACHING NOTE: error.code is a machine-readable string like
          // "auth/email-already-in-use" — useful for showing custom
          // messages instead of raw Firebase errors to the end user.
          showStatus(translateError(error.code), true);
        });
    });

    // ---------------------------------------------------------------
    // 4. LOG IN
    // ---------------------------------------------------------------
    document.getElementById("btnLogIn").addEventListener("click", () => {
      const email = emailInput.value;
      const password = passwordInput.value;

      auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          showStatus(`Logged in as: ${user.email}`);
        })
        .catch((error) => {
          showStatus(translateError(error.code), true);
        });
    });

    // ---------------------------------------------------------------
    // 5. LOG OUT
    // ---------------------------------------------------------------
    document.getElementById("btnLogOut").addEventListener("click", () => {
      auth.signOut().then(() => {
        showStatus("Logged out.");
      });
    });

    // ---------------------------------------------------------------
    // 6. AUTH STATE LISTENER
    // ---------------------------------------------------------------
    // TEACHING NOTE: this is one of the most important concepts to teach —
    // onAuthStateChanged() fires automatically whenever the login state
    // changes (login, logout, or even when the page first loads and
    // Firebase restores a previous session from local storage). This is
    // the recommended way to know "is someone logged in right now?"
    // instead of manually tracking it yourself.
    auth.onAuthStateChanged((user) => {
      if (user) {
        console.log("Auth state changed: logged in as", user.email);
      } else {
        console.log("Auth state changed: no user logged in");
      }
    });

    // ---------------------------------------------------------------
    // 7. ERROR MESSAGE HELPER
    // ---------------------------------------------------------------
    function translateError(errorCode) {
      switch (errorCode) {
        case "auth/email-already-in-use":
          return "That email is already registered.";
        case "auth/weak-password":
          return "Password is too weak (minimum 6 characters).";
        case "auth/invalid-email":
          return "Invalid email format.";
        case "auth/wrong-password":
        case "auth/invalid-credential":
          return "Incorrect email or password.";
        case "auth/user-not-found":
          return "No account exists with that email.";
        default:
          return `Error: ${errorCode}`;
      }
    }
  </script>

</body>
</html>
