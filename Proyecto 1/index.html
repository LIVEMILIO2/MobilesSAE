<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Tasks</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="app">
    <header class="app-header">
      <h1>Campus Tasks</h1>
      <p class="subtitle">Inicia sesión o crea una cuenta</p>
    </header>

    <input type="email" id="emailInput" placeholder="Correo" autocomplete="off">
    <input type="password" id="passwordInput" placeholder="Contraseña">

    <div class="login-actions">
      <button id="logInBtn">Iniciar sesión</button>
      <button id="signUpBtn">Crear cuenta</button>
    </div>

    <p id="statusMsg" class="empty-state"></p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
